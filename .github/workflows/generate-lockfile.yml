name: Generate reproducible npm lockfile
on:
  push:
    branches: [main]
    paths: ['releases/v0.11.0-lockfile.request']
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate npm dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
      - name: Commit only the lockfile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): lock reproducible npm workspace dependencies'
            git push origin HEAD:main
          fi
