name: Android startup smoke test (signed APK)
on:
  workflow_run:
    workflows: ["Build signed updatable Android APK"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  launch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download the signed APK from the completed build
        uses: actions/download-artifact@v4
        with:
          pattern: 'ascend-android-v*-build*'
          merge-multiple: true
          path: apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify APK download
        run: test -s apk/ascend-android.apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Three cold-launch checks on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-cold-start-smoke.sh
      - name: Preserve sanitized emulator screenshots for UX review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascend-emulator-smoke-screenshots
          path: test-output/*.png
          retention-days: 14
          if-no-files-found: ignore
