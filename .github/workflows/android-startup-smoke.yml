name: Android startup smoke test (signed APK)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-startup-smoke.yml']
  workflow_run:
    workflows: ["Build signed updatable Android APK"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  launch:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: ascend-android-v0.9.1-build11
          path: apk
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 43780164463 }}
          github-token: ${{ github.token }}
      - name: Verify APK download
        run: test -s apk/ascend-android.apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Three cold-launch checks on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-cold-start-smoke.sh
