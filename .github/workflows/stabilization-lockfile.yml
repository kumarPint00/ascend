name: Generate deterministic ASCEND npm lockfile
on:
  push:
    branches: [stabilization/v0.9.2]
    paths: ['.github/workflows/stabilization-lockfile.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies into a root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile to stabilization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then echo 'Lockfile already current'; exit 0; fi
          git commit -m 'chore(deps): lock exact Expo and React Native dependency graph'
          git push origin HEAD:stabilization/v0.9.2
# Re-resolve after v0.9.2 package version bump, then keep the lockfile committed.
