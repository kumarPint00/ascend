# Temporary no-secrets APK: standalone release build signed with an ephemeral TEST key.
# Intentionally NOT a GitHub Release: it cannot guarantee in-place upgrades.
name: Build ASCEND test APK (no signing setup)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-test-apk.yml'
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test and typecheck
        run: npm test && npm run typecheck
      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone TEST release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Verify and rename test build
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          tools="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep -E "^package:|^application-label:"
          mkdir -p out
          cp "$apk" out/ascend-v0.4.0-test.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-v0.4.0-test-apk
          path: out/ascend-v0.4.0-test.apk
          retention-days: 30
          if-no-files-found: error
