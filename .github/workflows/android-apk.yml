name: Build Android APK (manual, no EAS required)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate before building
        run: npm test && npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile
      - name: Build standalone release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/mobile/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ascend-android-v0.1
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 3
          if-no-files-found: error
# Caution: default generated signing is for development/testing only.
# Do not distribute this build as a signed production Play Store release.
