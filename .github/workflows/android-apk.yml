name: Build signed updatable Android APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for in-app updates'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test and typecheck
        run: npm test && npm run typecheck
      - name: Read Android version
        id: version
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const app=require('./apps/mobile/app.json').expo;
          if(app.android.package!=='com.ascendrpg.personal') throw Error('Package ID cannot change');
          if(!/^\d+\.\d+\.\d+$/.test(app.version)) throw Error('Invalid version');
          if(!Number.isSafeInteger(app.android.versionCode)||app.android.versionCode<2) throw Error('Invalid build code');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+app.version+'\ncode='+app.android.versionCode+'\npackage='+app.android.package+'\n');
          NODE
      - name: Load stable signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ASCEND_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ASCEND_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASCEND_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASCEND_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Signing secrets missing; see docs/ANDROID_UPDATES.md.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ascend-release.jks"
          chmod 600 "$RUNNER_TEMP/ascend-release.jks"
          echo "ASCEND_KEYSTORE_FILE=$RUNNER_TEMP/ascend-release.jks" >> "$GITHUB_ENV"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.ASCEND_GOOGLE_ANDROID_CLIENT_ID }}
      - name: Assert native startup-safe R8 setting
        run: |
          grep -q '^android.enableMinifyInReleaseBuilds=false$' apps/mobile/android/gradle.properties
          echo 'R8 disabled for expo-background-task native startup safety'
      - name: Configure release signing
        run: node scripts/configure-android-signing.cjs
      - name: Build signed release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.ASCEND_GOOGLE_ANDROID_CLIENT_ID }}
          ASCEND_KEYSTORE_PASSWORD: ${{ secrets.ASCEND_ANDROID_KEYSTORE_PASSWORD }}
          ASCEND_KEY_ALIAS: ${{ secrets.ASCEND_ANDROID_KEY_ALIAS }}
          ASCEND_KEY_PASSWORD: ${{ secrets.ASCEND_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon -Pandroid.enableMinifyInReleaseBuilds=false
      - name: Validate signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk='apps/mobile/android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          tools="${ANDROID_HOME}/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/ascend-signature.txt"
          grep -Fq 'certificate SHA-256 digest: 60b4aef9ee10d6f696063ddd45601216e277be0771fe967db156ad6dd6ec5521' "$RUNNER_TEMP/ascend-signature.txt"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/ascend-badging.txt"
          grep -Fq "package: name='${{ steps.version.outputs.package }}' versionCode='${{ steps.version.outputs.code }}' versionName='${{ steps.version.outputs.version }}'" "$RUNNER_TEMP/ascend-badging.txt"
          cp "$apk" ascend-android.apk
      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend-android-v${{ steps.version.outputs.version }}-build${{ steps.version.outputs.code }}
          path: ascend-android.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish update
        if: ${{ inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; increment version and versionCode." >&2
            exit 1
          fi
          notes=$(printf 'ASCEND Android %s (build %s)\n\nSigned update preserves existing app data when the key matches.\n\n<!-- ASCEND_ANDROID_RELEASE {"packageName":"%s","versionCode":%s} -->' "$VERSION" "$VERSION_CODE" "$APP_PACKAGE" "$VERSION_CODE")
          gh release create "$tag" 'ascend-android.apk#ascend-android.apk' --target "$GITHUB_SHA" --title "ASCEND v${VERSION}" --notes "$notes" --latest
